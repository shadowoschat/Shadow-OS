<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHADOW OS — Verify Operator OTP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Orbitron:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/otp.css') }}" />
  </head>
  <body>
    <!-- HUD Corners -->
    <span class="hud-corner hud-tl"></span>
    <span class="hud-corner hud-tr"></span>
    <span class="hud-corner hud-bl"></span>
    <span class="hud-corner hud-br"></span>

    <main class="auth-container">
      <header class="auth-header">
        <img src="{{ url_for('static', filename='image/logo.svg') }}" alt="Shadow OS Logo" class="auth-logo" />
        <h1 class="auth-title">SHADOW <span>OS</span></h1>
        <p class="auth-subtitle">SESSION AUTHORIZATION REQUIRED</p>
      </header>

      <div class="otp-instruction">Enter the 6-digit verification code sent to your registered email address.</div>

      <form class="auth-form" id="otpForm" novalidate>
        <div class="otp-boxes-wrapper">
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric" autocomplete="one-time-code" autofocus />
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric" />
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric" />
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric" />
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric" />
          <input type="text" class="otp-digit-input" maxlength="1" inputmode="numeric" />
        </div>

        <div class="otp-timer" id="otpTimerDisplay">EXPIRES IN: 05:00</div>

        <button type="submit" class="btn-auth-submit" id="otpVerifyBtn">
          <span>VERIFY OPERATOR SESSION</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <div class="form-row-between" style="margin-top: 10px;">
          <a href="#" class="link-cyber" id="resendOtpBtn">Resend Code</a>
          <a href="/login" class="link-cyber">Back to Login</a>
        </div>
      </form>
    </main>

    <div class="auth-toast" id="authToast"></div>
    <script src="{{ url_for('static', filename='Js/otp.js') }}"></script>
  </body>
</html>
