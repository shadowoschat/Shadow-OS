<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHADOW OS — Password Recovery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Orbitron:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='CSS/forgot-password.css') }}" />
</head>
<body>
  <!-- HUD Corners -->
  <span class="hud-corner hud-tl"></span>
  <span class="hud-corner hud-tr"></span>
  <span class="hud-corner hud-bl"></span>
  <span class="hud-corner hud-br"></span>

  <main class="auth-container">
    <header class="auth-header">
      <img src="{{ url_for('static', filename='image/logo.svg') }}" alt="Shadow OS Logo" class="auth-logo" />
      <h1 class="auth-title">SHADOW <span>OS</span></h1>
      <p class="auth-subtitle">OPERATOR CIPHER RECOVERY</p>
    </header>

    <!-- STEP 1: Enter Email -->
    <div id="recoveryStep1" class="recovery-step">
      <div class="step-badge">STEP 1 / 2 : IDENTITY VERIFICATION</div>
      <form class="auth-form" id="forgotEmailForm" novalidate>
        <div class="form-group">
          <label for="recoveryEmail" class="form-label">Registered Email</label>
          <div class="input-container">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" id="recoveryEmail" class="form-input" placeholder="operator@shadow.ai" required />
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" id="sendOtpBtn">
          <span>SEND RECOVERY CODE</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <footer class="auth-footer">
          <a href="/login" class="link-cyber">← Back to Login</a>
        </footer>
      </form>
    </div>

    <!-- STEP 2: Enter OTP & New Password -->
    <div id="recoveryStep2" class="recovery-step" style="display: none;">
      <div class="step-badge">STEP 2 / 2 : RE-KEY CIPHER</div>
      <form class="auth-form" id="resetPassForm" novalidate>
        <div class="form-group">
          <label for="recoveryOtp" class="form-label">6-Digit Recovery Key</label>
          <div class="input-container">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="text" id="recoveryOtp" class="form-input" placeholder="123456" maxlength="6" inputmode="numeric" required />
          </div>
        </div>

        <div class="form-group">
          <label for="newPassword" class="form-label">New Password</label>
          <div class="input-container">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a5 5 0 00-5 5v3H5a1 1 0 00-1 1v11a1 1 0 001 1h14a1 1 0 001-1V10a1 1 0 00-1-1h-2V6a5 5 0 00-5-5zm3 8H9V6a3 3 0 016 0v3z"></path>
            </svg>
            <input type="password" id="newPassword" class="form-input" placeholder="••••••••" required />
          </div>
        </div>

        <div class="form-group">
          <label for="confirmNewPassword" class="form-label">Confirm New Password</label>
          <div class="input-container">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a5 5 0 00-5 5v3H5a1 1 0 00-1 1v11a1 1 0 001 1h14a1 1 0 001-1V10a1 1 0 00-1-1h-2V6a5 5 0 00-5-5zm3 8H9V6a3 3 0 016 0v3z"></path>
            </svg>
            <input type="password" id="confirmNewPassword" class="form-input" placeholder="••••••••" required />
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" id="resetSubmitBtn">
          <span>UPDATE PASSWORD</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <footer class="auth-footer">
          <a href="/login" class="link-cyber">Cancel & Return to Login</a>
        </footer>
      </form>
    </div>
  </main>

  <div class="auth-toast" id="authToast"></div>
  <script src="{{ url_for('static', filename='Js/forgot-password.js') }}"></script>
</body>
</html>
