<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHADOW OS — Operator Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Orbitron:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/login.css') }}" />
  </head>
  <body>
    <!-- HUD Corners -->
    <span class="hud-corner hud-tl"></span>
    <span class="hud-corner hud-tr"></span>
    <span class="hud-corner hud-bl"></span>
    <span class="hud-corner hud-br"></span>

    <main class="auth-container">
      <header class="auth-header">
        <img src="{{ url_for('static', filename='image/logo.svg') }}" alt="Shadow OS Logo" class="auth-logo" />
        <h1 class="auth-title">SHADOW <span>OS</span></h1>
        <p class="auth-subtitle">SECURE OPERATOR AUTHENTICATION</p>
      </header>

      <form class="auth-form" id="loginForm" novalidate>
        <div class="form-group">
          <label for="loginIdentifier" class="form-label">Email or Username</label>
          <div class="input-container">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="loginIdentifier" class="form-input" placeholder="admin or operator@shadow.ai" autocomplete="username" required />
          </div>
          <div class="field-error" id="idError"></div>
        </div>

        <div class="form-group">
          <label for="loginPassword" class="form-label">Password</label>
          <div class="input-container">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="btn-toggle-password" id="togglePassword">SHOW</button>
          </div>
          <div class="field-error" id="passError"></div>
        </div>

        <div class="form-row-between">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" checked />
            <span>Remember identity</span>
          </label>
          <a href="/forgot-password" class="link-cyber">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-auth-submit" id="loginSubmitBtn">
          <span>ACCESS TERMINAL</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <div class="auth-divider">
          <span>OR AUTHENTICATE WITH</span>
        </div>

        <div class="social-buttons">
          <button type="button" class="btn-social">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.053 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z" />
            </svg>
            <span>Google</span>
          </button>
          <button type="button" class="btn-social">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
            </svg>
            <span>GitHub</span>
          </button>
        </div>

        <footer class="auth-footer">
          <span>Need an operator identity?</span>
          <a href="/signup" class="link-cyber">Create Account</a>
        </footer>
      </form>
    </main>

    <div class="auth-toast" id="authToast"></div>
    <script src="{{ url_for('static', filename='Js/login.js') }}"></script>
  </body>
</html>
