<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHADOW OS — Create Operator Identity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Orbitron:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/signup.css') }}" />
  </head>
  <body>
    <!-- HUD Corners -->
    <span class="hud-corner hud-tl"></span>
    <span class="hud-corner hud-tr"></span>
    <span class="hud-corner hud-bl"></span>
    <span class="hud-corner hud-br"></span>

    <main class="auth-container wide">
      <header class="auth-header">
        <img src="{{ url_for('static', filename='image/logo.svg') }}" alt="Shadow OS Logo" class="auth-logo" />
        <h1 class="auth-title">SHADOW <span>OS</span></h1>
        <p class="auth-subtitle">INITIALIZE OPERATOR IDENTITY PROTOCOL</p>
      </header>

      <form class="auth-form" id="signupForm" novalidate>
        <div class="form-grid-2">
          <div class="form-group">
            <label for="suFirstName" class="form-label">First Name</label>
            <div class="input-container">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input type="text" id="suFirstName" class="form-input" placeholder="First Name" required />
            </div>
          </div>

          <div class="form-group">
            <label for="suLastName" class="form-label">Last Name</label>
            <div class="input-container">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input type="text" id="suLastName" class="form-input" placeholder="Last Name" required />
            </div>
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label for="suEmail" class="form-label">Email Address</label>
            <div class="input-container">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input type="email" id="suEmail" class="form-input" placeholder="User@gmail.com" required />
            </div>
          </div>

          <div class="form-group">
            <label for="suUsername" class="form-label">Username</label>
            <div class="input-container">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="9" y1="21" x2="9" y2="9"></line>
              </svg>
              <input type="text" id="suUsername" class="form-input" placeholder="User@007" required />
            </div>
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <div class="form-row-between">
              <label for="suPassword" class="form-label">Password</label>
              <span id="strengthText" style="font-family: var(--font-mono); font-size: 0.65rem; color: var(--cyan);">STRENGTH</span>
            </div>
            <div class="input-container">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" id="suPassword" class="form-input" placeholder="••••••••" required />
            </div>
            <div class="strength-track">
              <div class="strength-bar" id="strengthBar"></div>
            </div>
          </div>

          <div class="form-group">
            <label for="suConfirm" class="form-label">Confirm Password</label>
            <div class="input-container">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" id="suConfirm" class="form-input" placeholder="••••••••" required />
            </div>
          </div>
        </div>

        <label class="checkbox-label">
          <input type="checkbox" id="suTerms" required />
          <span>I accept the Shadow OS Neural Security & Operator Terms</span>
        </label>

        <button type="submit" class="btn-auth-submit" id="signupSubmitBtn">
          <span>CREATE OPERATOR IDENTITY</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <footer class="auth-footer">
          <span>Already initialized?</span>
          <a href="/login" class="link-cyber">Log In to Console</a>
        </footer>
      </form>
    </main>

    <div class="auth-toast" id="authToast"></div>
    <script src="{{ url_for('static', filename='Js/signup.js') }}"></script>
  </body>
</html>
