<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00eaff" />
      <stop offset="50%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#00ff9d" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00eaff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Hexagon -->
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="none" stroke="url(#neonCyan)" stroke-width="3" filter="url(#glow)" />
  <!-- Inner Circuit Hexagon -->
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" fill="rgba(0, 234, 255, 0.06)" stroke="url(#neonCyan)" stroke-width="1.5" stroke-dasharray="8 4" />
  <!-- Shadow "S" Glyph -->
  <path d="M62 30 C58 26, 42 26, 38 32 C34 38, 40 45, 52 48 C64 51, 68 58, 64 66 C60 74, 42 74, 36 68" fill="none" stroke="url(#coreGlow)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
  <!-- Center Energy Node -->
  <circle cx="50" cy="50" r="3.5" fill="#00ff9d" filter="url(#glow)" />
  <!-- Orbiting Dots -->
  <circle cx="50" cy="15" r="2" fill="#00eaff" />
  <circle cx="80" cy="68" r="2" fill="#00ff9d" />
  <circle cx="20" cy="68" r="2" fill="#00eaff" />
</svg>
